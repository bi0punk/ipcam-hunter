name: ci

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python 3.12
      - name: Instalar proyecto y herramientas
        run: uv pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Mypy
        run: .venv/bin/mypy app/roi_alert app/web/webapp scripts
      - name: Vulture
        run: .venv/bin/vulture app scripts vulture_whitelist.py --min-confidence 60
      - name: Bandit
        run: .venv/bin/bandit -r app scripts -q

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Crear entorno virtual
        run: uv venv --python ${{ matrix.python-version }}
      - name: Instalar proyecto y dev
        run: uv pip install -e ".[dev]"
      - name: Pytest con cobertura
        run: .venv/bin/pytest -q --cov=roi_alert --cov=webapp --cov-report=term-missing --cov-fail-under=65

  audit:
    name: audit deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e .
      - run: uv pip install pip-audit
      - run: .venv/bin/pip-audit --skip-editable

  docker:
    name: docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: worker
            context: .
            image: ghcr.io/${{ github.repository }}
          - name: dashboard
            context: ./app/web
            image: ghcr.io/${{ github.repository }}-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadatos
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
      - name: Build y push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
