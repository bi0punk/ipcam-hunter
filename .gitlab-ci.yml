# CI/CD en GitLab. GitHub solo aloja el código.
# El job `deploy` es manual y necesita un runner con tag `local` en la máquina
# donde corre Docker Compose. Los jobs de `build` requieren un runner con
# Docker privilegiado (dind) y un Container Registry habilitado.

stages:
  - quality
  - test
  - audit
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip

quality:
  stage: quality
  script:
    - pip install -e '.[dev]'
    - ruff check .
    - mypy app/roi_alert app/web/webapp scripts
    - vulture app scripts vulture_whitelist.py --min-confidence 60
    - bandit -r app scripts -q

test:
  stage: test
  script:
    - pip install -e '.[dev]'
    - pytest -q --cov=roi_alert --cov=webapp --cov-report=term-missing --cov-fail-under=65

audit:
  stage: audit
  script:
    - pip install -e .
    - pip install pip-audit
    - pip-audit --skip-editable

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - if [ -z "$CI_REGISTRY" ]; then echo "Sin Container Registry configurado"; exit 0; fi
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker build -t $CI_REGISTRY_IMAGE:dashboard-latest app/web
    - docker push $CI_REGISTRY_IMAGE:dashboard-latest

deploy:
  stage: deploy
  image: docker:27
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  tags:
    - [local]
  script:
    - docker compose up -d --build
