camera:
  process_width: 640          # ancho al que se reescala para inferencia/ROI coords
  fps_limit: 8                # inferencia efectiva (aprox)
  capture_fps_limit: 20       # captura interna (para baja latencia)
  reconnect_backoff_sec: 2
  detect_every_n_frames: 1
  overlay_hz: 10              # overlay.json ~10 Hz

model:
  yolo_weights: "yolov8n.pt"
  conf_thres: 0.35

roi:
  name: "zona_1"
  points: [[409,200],[600,200],[600,292],[409,292]]

  # opcional: si quieres cargar ROI desde tu roi.json (xyxy en 1920x1080)
  # from_json: true
  # json_path: "./roi.json"

logic:
  dwell_seconds: 2.0
  cooldown_seconds: 60
  iou_match_thres: 0.30
  track_ttl_seconds: 2.0

whatsapp:
  session: "default"
  # chat_id del grupo: definir por entorno WAHA_CHAT_ID (.env), NO commitear IDs reales.
  chat_id: ""
  caption_template: "Alerta: persona en {roi} por {dwell:.1f}s | {ts}"

storage:
  events_dir: "./events"     # se auto-redirige a /data/events si existe
  save_annotated: true       # guarda evidencia anotada SOLO en evento

evidence:
  # "rtsp" = usa el frame re-escalado (default seguro, sin red extra).
  # "isapi" = snapshot HQ; requiere ISAPI_URL/USER/PASS en .env (si faltan, cae a rtsp).
  mode: "rtsp"
  timeout_s: 4
  fallback_to_rtsp: true

isapi:
  # URL se define por entorno ISAPI_URL (.env). Vacio = deshabilitado.
  url: ""
  auth: "digest"