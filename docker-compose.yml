services:
  waha:
    image: devlikeapro/waha
    container_name: waha
    ports:
      - "3000:3000"
    environment:
      WAHA_API_KEY: "${WAHA_API_KEY}"
    volumes:
      - ./waha-sessions:/app/.sessions
    restart: unless-stopped

  roi-alert:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/bi0punk/ipcam-hunter:latest
    container_name: roi-alert
    depends_on:
      - waha
    env_file:
      - .env
    environment:
      - CONFIG_PATH=/app/config.yaml
      - EVENTS_DIR=/data/events
      - WAHA_API_KEY=${WAHA_API_KEY}
    volumes:
      - ./app/config.yaml:/app/config.yaml:ro
      - ./events:/data/events
      - ./cache:/home/hunter/.cache
      - ./ultralytics:/home/hunter/.config/Ultralytics
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; p='/data/events/status.json'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  dashboard:
    build:
      context: ./app/web
      dockerfile: Dockerfile
    image: ghcr.io/bi0punk/ipcam-hunter-dashboard:latest
    container_name: roi-dashboard
    depends_on:
      roi-alert:
        condition: service_started
    environment:
      - EVENTS_DIR=/data/events
      - STATUS_FILENAME=status.json
      - CAM_RTSP_URL_PREVIEW=${CAM_RTSP_URL_PREVIEW}
    ports:
      - "8081:8081"
    volumes:
      - ./events:/data/events:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
